<title>GrowBase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ── Design tokens ─────────────────────────────────────────────────────── */
:root {
  /* layout */
  --sidebar-w: 260px;
  --panel-w: 280px;

  /* light palette */
  --bg-app:      #f0f0ed;
  --bg-sidebar:  #1e1e1e;
  --bg-panel:    #f7f7f5;
  --bg-card:     #ffffff;
  --bg-card-processing: #f0f7ff;
  --bg-input:    #ffffff;
  --bg-hover:    rgba(0,0,0,0.05);
  --bg-active:   rgba(99,130,255,0.12);

  --fg:          #1a1a1a;
  --fg-2:        #555;
  --fg-3:        #999;
  --fg-sidebar:  #ccc;
  --fg-sidebar-2:#888;
  --fg-sidebar-active: #fff;

  --accent:      #5b6af0;
  --accent-2:    #7c8cf8;
  --border:      rgba(0,0,0,0.08);
  --border-sidebar: rgba(255,255,255,0.07);

  --tag-blue-bg: #eef0ff; --tag-blue-fg: #4a5ce8;
  --tag-gold-bg: #fff8e6; --tag-gold-fg: #b07d00;
  --tag-green-bg:#edfaf2; --tag-green-fg:#1a7a46;
  --tag-red-bg:  #fff0f0; --tag-red-fg:  #c0392b;

  --font-ui: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-app:      #141414;
    --bg-sidebar:  #111111;
    --bg-panel:    #1a1a1a;
    --bg-card:     #1f1f1f;
    --bg-card-processing: #1a2035;
    --bg-input:    #2a2a2a;
    --bg-hover:    rgba(255,255,255,0.05);
    --bg-active:   rgba(99,130,255,0.18);
    --fg:          #e8e8e8;
    --fg-2:        #aaa;
    --fg-3:        #666;
    --fg-sidebar:  #ccc;
    --fg-sidebar-2:#777;
    --border:      rgba(255,255,255,0.07);
    --tag-blue-bg: #1a1f3a; --tag-blue-fg: #7c8cf8;
    --tag-gold-bg: #2a2010; --tag-gold-fg: #e8a820;
    --tag-green-bg:#102018; --tag-green-fg:#3ecf7a;
    --tag-red-bg:  #2a1010; --tag-red-fg:  #e05858;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-app:      #141414;
  --bg-sidebar:  #111111;
  --bg-panel:    #1a1a1a;
  --bg-card:     #1f1f1f;
  --bg-card-processing: #1a2035;
  --bg-input:    #2a2a2a;
  --bg-hover:    rgba(255,255,255,0.05);
  --bg-active:   rgba(99,130,255,0.18);
  --fg:          #e8e8e8;
  --fg-2:        #aaa;
  --fg-3:        #666;
  --border:      rgba(255,255,255,0.07);
  --tag-blue-bg: #1a1f3a; --tag-blue-fg: #7c8cf8;
  --tag-gold-bg: #2a2010; --tag-gold-fg: #e8a820;
  --tag-green-bg:#102018; --tag-green-fg:#3ecf7a;
  --tag-red-bg:  #2a1010; --tag-red-fg:  #e05858;
  color-scheme: dark;
}

/* ── Reset ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html, body { height: 100%; font-family: var(--font-ui); font-size: 14px; background: var(--bg-app); color: var(--fg) }
button { font: inherit; cursor: pointer; border: none; background: none }
input, textarea { font: inherit; color: inherit; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; outline: none }
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(91,106,240,0.15) }
a { color: var(--accent); text-decoration: none }
a:hover { text-decoration: underline }

/* ── App shell ─────────────────────────────────────────────────────────── */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 100%;
  height: 100%;
  overflow: hidden;
}

/* ── Sidebar ───────────────────────────────────────────────────────────── */
#sidebar {
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid rgba(255,255,255,0.04);
}

.sidebar-header {
  padding: 16px 14px 12px;
  border-bottom: 1px solid var(--border-sidebar);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.sidebar-logo {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  letter-spacing: .04em;
}
.sidebar-logo span { color: var(--accent-2) }

.sidebar-actions {
  display: flex;
  gap: 4px;
  margin-left: auto;
}
.icon-btn {
  width: 26px; height: 26px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-sidebar-2);
  transition: background .12s, color .12s;
  font-size: 14px;
}
.icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--fg-sidebar) }
.icon-btn.active { background: var(--bg-active); color: var(--accent-2) }

/* vault tree */
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0 }
.sidebar-scroll::-webkit-scrollbar { width: 4px }
.sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px }

.vault-item {
  user-select: none;
}
.vault-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px 5px 10px;
  border-radius: 0;
  cursor: pointer;
  color: var(--fg-sidebar);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .01em;
  transition: background .1s;
}
.vault-header:hover { background: rgba(255,255,255,0.05) }
.vault-header.active { background: var(--bg-active); color: #fff }

.vault-chevron {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-sidebar-2);
  transition: transform .15s;
  flex-shrink: 0;
  font-size: 10px;
}
.vault-chevron.open { transform: rotate(90deg) }

.vault-icon {
  font-size: 13px;
  flex-shrink: 0;
  opacity: .7;
}

.vault-badge {
  margin-left: auto;
  background: rgba(255,255,255,0.08);
  color: var(--fg-sidebar-2);
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 1px 5px;
  border-radius: 10px;
}

/* category tree inside vault */
.cat-tree { display: none; padding-bottom: 4px }
.cat-tree.open { display: block }

.cat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px 4px 28px;
  cursor: pointer;
  color: var(--fg-sidebar-2);
  font-size: 12.5px;
  transition: color .1s, background .1s;
  border-radius: 0;
}
.cat-item:hover { background: rgba(255,255,255,0.04); color: var(--fg-sidebar) }
.cat-item.active { background: rgba(99,130,255,0.12); color: var(--accent-2) }
.cat-item .cat-icon { font-size: 11px; opacity: .6 }
.cat-item .cat-count {
  margin-left: auto;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--fg-sidebar-2);
  opacity: .7;
}

/* sub-categories */
.subcat-item {
  padding-left: 44px;
  font-size: 12px;
}

.cat-all {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px 4px 28px;
  cursor: pointer;
  color: var(--fg-sidebar-2);
  font-size: 12px;
  font-style: italic;
  transition: color .1s, background .1s;
}
.cat-all:hover { color: var(--fg-sidebar) }
.cat-all.active { color: var(--accent-2) }

/* sidebar footer */
.sidebar-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border-sidebar);
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.sidebar-footer-btn {
  flex: 1;
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--fg-sidebar-2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background .1s, color .1s;
}
.sidebar-footer-btn:hover { background: rgba(255,255,255,0.07); color: var(--fg-sidebar) }

/* ── Main area ─────────────────────────────────────────────────────────── */
#main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-app);
}

/* toolbar */
#toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 24px;
  height: 50px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.toolbar-breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--fg-2);
  min-width: 0;
}
.breadcrumb-sep { color: var(--fg-3) }
.breadcrumb-current { color: var(--fg); font-weight: 500 }

.toolbar-search {
  flex: 1;
  max-width: 280px;
  margin-left: auto;
  position: relative;
}
.toolbar-search input {
  width: 100%;
  padding: 5px 10px 5px 30px;
  font-size: 13px;
  border-radius: 6px;
}
.toolbar-search .search-icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg-3);
  font-size: 12px;
  pointer-events: none;
}

.toolbar-btns {
  display: flex;
  gap: 6px;
  margin-left: 10px;
}
.btn {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  transition: background .12s, opacity .12s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.btn-ghost { color: var(--fg-2); background: var(--bg-hover) }
.btn-ghost:hover { background: rgba(0,0,0,0.1) }
.btn-primary { background: var(--accent); color: #fff }
.btn-primary:hover { opacity: .9 }
.btn-icon { padding: 5px 8px }

/* processing banner */
#processing-banner {
  background: rgba(91,106,240,0.08);
  border-bottom: 1px solid rgba(91,106,240,0.15);
  padding: 7px 24px;
  font-size: 12.5px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
#processing-banner.hidden { display: none }
.spinner { animation: spin 1s linear infinite; display: inline-block }
@keyframes spin { to { transform: rotate(360deg) } }

/* knowledge list */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}
#content::-webkit-scrollbar { width: 5px }
#content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px }

.content-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 860px;
}

/* knowledge card */
.k-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  transition: box-shadow .12s, border-color .12s;
}
.k-card:hover { border-color: rgba(91,106,240,0.3); box-shadow: 0 2px 8px rgba(0,0,0,0.06) }
.k-card.processing { background: var(--bg-card-processing); border-color: rgba(91,106,240,0.3) }

.k-card-icon {
  width: 32px; height: 32px;
  border-radius: 6px;
  background: var(--bg-hover);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  margin-top: 2px;
}

.k-card-body { flex: 1; min-width: 0 }

.k-card-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--fg);
  margin-bottom: 4px;
  line-height: 1.4;
}

.k-card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 500;
}
.tag-blue  { background: var(--tag-blue-bg);  color: var(--tag-blue-fg) }
.tag-gold  { background: var(--tag-gold-bg);  color: var(--tag-gold-fg) }
.tag-green { background: var(--tag-green-bg); color: var(--tag-green-fg) }
.tag-red   { background: var(--tag-red-bg);   color: var(--tag-red-fg) }
.tag-gray  { background: var(--bg-hover);     color: var(--fg-2) }

.k-card-summary {
  font-size: 12.5px;
  color: var(--fg-2);
  line-height: 1.6;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.k-card-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.k-tag {
  font-size: 11px;
  color: var(--fg-3);
  background: var(--bg-hover);
  padding: 1px 6px;
  border-radius: 3px;
  font-family: var(--font-mono);
}

.k-card-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
  align-self: flex-start;
}
.k-action-btn {
  width: 28px; height: 28px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-3);
  font-size: 13px;
  transition: background .1s, color .1s;
}
.k-action-btn:hover { background: var(--bg-hover); color: var(--fg) }
.k-action-btn.danger:hover { background: var(--tag-red-bg); color: var(--tag-red-fg) }

/* processing card */
.proc-steps {
  display: flex;
  gap: 0;
  margin-top: 8px;
}
.proc-step {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--fg-3);
}
.proc-step.done { color: var(--tag-green-fg) }
.proc-step.active { color: var(--accent) }
.proc-sep { margin: 0 6px; color: var(--fg-3); font-size: 10px }
.proc-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.proc-dot.spinning {
  animation: pulse 1s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: .3 } to { opacity: 1 } }

/* ── AI panel (right) ──────────────────────────────────────────────────── */
#main.chat-mode {
  grid-column: span 1;
}
/* When chat tab is active we swap content area */
#view-knowledge { display: flex; flex-direction: column; height: 100%; }
#view-chat { display: none; flex-direction: column; height: 100%; }
#main.chat-active #view-knowledge { display: none }
#main.chat-active #view-chat { display: flex }

/* chat */
#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
#chat-messages::-webkit-scrollbar { width: 5px }
#chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px }

.chat-row { display: flex; gap: 10px; align-items: flex-end }
.chat-row.user { flex-direction: row-reverse }
.chat-bubble {
  max-width: 72%;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13.5px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.chat-row.user .chat-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 3px }
.chat-row.assistant .chat-bubble { background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 3px }
.chat-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg-hover);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.chat-row.user .chat-avatar { background: var(--accent); color: #fff }
.chat-row.assistant .chat-avatar { background: var(--bg-card); border: 1px solid var(--border); color: var(--accent) }

#chat-input-row {
  display: flex;
  gap: 8px;
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  background: var(--bg-panel);
  flex-shrink: 0;
}
#chat-input-row input {
  flex: 1;
  padding: 8px 12px;
  font-size: 13.5px;
  border-radius: 7px;
}
#chat-send {
  padding: 8px 14px;
  border-radius: 7px;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  transition: opacity .12s;
}
#chat-send:hover { opacity: .88 }

/* chat empty */
.chat-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--fg-3);
  padding: 40px;
}
.chat-empty-icon { font-size: 40px; opacity: .4 }
.chat-empty-title { font-size: 16px; font-weight: 500; color: var(--fg-2) }
.chat-empty-subtitle { font-size: 13px; text-align: center; max-width: 320px; line-height: 1.6 }
.chat-prompts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px }
.chat-prompt-btn {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  background: var(--bg-hover);
  color: var(--fg-2);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s, color .1s;
}
.chat-prompt-btn:hover { background: var(--bg-active); color: var(--accent) }

/* ── Tab bar (above content) ───────────────────────────────────────────── */
#tabbar {
  display: flex;
  align-items: center;
  height: 36px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
  padding: 0 24px;
  gap: 0;
  flex-shrink: 0;
}
.tab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 14px;
  height: 100%;
  font-size: 13px;
  color: var(--fg-2);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color .12s;
  white-space: nowrap;
}
.tab:hover { color: var(--fg) }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500 }
.tab-badge {
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  padding: 0 5px;
  border-radius: 10px;
  min-width: 16px;
  text-align: center;
}

/* ── Modal ─────────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity .15s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 540px;
  max-width: calc(100vw - 32px);
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
  transform: scale(.97) translateY(6px);
  transition: transform .15s;
}
.modal-overlay.open .modal { transform: none }
.modal-title { font-size: 15px; font-weight: 600; margin-bottom: 18px }
.modal-field { margin-bottom: 14px }
.modal-label { font-size: 12px; font-weight: 500; color: var(--fg-2); margin-bottom: 5px }
.modal-field input, .modal-field textarea {
  width: 100%; padding: 8px 10px; border-radius: 6px; font-size: 13.5px;
}
.modal-field textarea { resize: vertical; min-height: 90px }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end }
.btn-cancel { padding: 7px 16px; border-radius: 6px; background: var(--bg-hover); color: var(--fg-2); font-size: 13px; transition: background .1s }
.btn-cancel:hover { background: rgba(0,0,0,0.1) }
.btn-submit { padding: 7px 18px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 500; transition: opacity .12s }
.btn-submit:hover { opacity: .88 }

/* empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px; gap: 12px; text-align: center;
}
.empty-state-icon { font-size: 36px; opacity: .25 }
.empty-state-title { font-size: 15px; font-weight: 500; color: var(--fg-2) }
.empty-state-sub { font-size: 13px; color: var(--fg-3); max-width: 300px; line-height: 1.6 }

/* no-template banner */
#no-template-banner {
  margin: 0 24px 12px;
  padding: 10px 14px;
  background: rgba(255,180,0,0.08);
  border: 1px solid rgba(255,180,0,0.25);
  border-radius: 7px;
  font-size: 13px;
  color: var(--tag-gold-fg);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
#no-template-banner.hidden { display: none }
#no-template-banner button {
  margin-left: auto;
  padding: 3px 10px;
  border-radius: 5px;
  font-size: 12px;
  background: var(--tag-gold-bg);
  color: var(--tag-gold-fg);
  border: 1px solid rgba(255,180,0,0.3);
}

/* responsive */
@media (max-width: 640px) {
  :root { --sidebar-w: 220px }
  #app { grid-template-columns: 0 1fr }
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform .2s }
  #sidebar.mobile-open { transform: none }
}
</style>

<div id="app">
  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">Grow<span>Base</span></span>
      <div class="sidebar-actions">
        <button class="icon-btn" title="新建知识空间" onclick="openModal('create-org')">＋</button>
        <button class="icon-btn" title="AI 设置" onclick="location.href='/settings'">⚙</button>
      </div>
    </div>

    <div class="sidebar-scroll" id="vault-tree">
      <!-- vaults rendered by JS -->
    </div>

    <div class="sidebar-footer">
      <button class="sidebar-footer-btn" onclick="location.href='/'">
        ← 返回主页
      </button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main id="main">
    <!-- tab bar -->
    <div id="tabbar">
      <div class="tab active" id="tab-knowledge" onclick="switchTab('knowledge')">📚 知识库</div>
      <div class="tab" id="tab-chat" onclick="switchTab('chat')">🤖 AI 助手 <span class="tab-badge" id="processing-badge" hidden>0</span></div>
    </div>

    <!-- toolbar -->
    <div id="toolbar">
      <div class="toolbar-breadcrumb" id="breadcrumb">
        <span id="bc-vault">—</span>
      </div>
      <div class="toolbar-search">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索知识…" oninput="handleSearch()">
      </div>
      <div class="toolbar-btns">
        <button class="btn btn-ghost btn-icon" title="重新整理" onclick="handleReprocess()">↺</button>
        <button class="btn btn-primary" onclick="openModal('add-knowledge')">＋ 添加知识</button>
      </div>
    </div>

    <!-- no template banner -->
    <div id="no-template-banner" class="hidden">
      ⚠ 还没有选择分类体系，AI 无法按规则整理知识。
      <button onclick="location.href='/org/'+currentOrgId+'/settings'">立即选择</button>
    </div>

    <!-- processing banner -->
    <div id="processing-banner" class="hidden">
      <span class="spinner">⟳</span>
      <span id="processing-text">AI 正在处理…</span>
    </div>

    <!-- knowledge view -->
    <div id="view-knowledge">
      <div id="content">
        <div class="content-grid" id="knowledge-list">
          <!-- rendered by JS -->
        </div>
      </div>
    </div>

    <!-- chat view -->
    <div id="view-chat">
      <div id="chat-messages">
        <div class="chat-empty" id="chat-empty">
          <div class="chat-empty-icon">🤖</div>
          <div class="chat-empty-title">从你的知识库开始提问</div>
          <div class="chat-empty-subtitle">可以问主题、来源、分类，也可以说"整理知识"触发重新整理。</div>
          <div class="chat-prompts">
            <button class="chat-prompt-btn" onclick="fillChat('我的知识库里有哪些内容？')">我的知识库里有哪些内容？</button>
            <button class="chat-prompt-btn" onclick="fillChat('整理知识')">整理知识</button>
            <button class="chat-prompt-btn" onclick="fillChat('哪些内容需要确认？')">哪些内容需要确认？</button>
          </div>
        </div>
      </div>
      <div id="chat-input-row">
        <input type="text" id="chat-input" placeholder="询问你的知识库，或输入"整理知识"" onkeydown="if(event.key==='Enter')sendChat()">
        <button id="chat-send" onclick="sendChat()">发送 ↑</button>
      </div>
    </div>
  </main>
</div>

<!-- ── Add knowledge modal ── -->
<div class="modal-overlay" id="modal-add-knowledge">
  <div class="modal">
    <div class="modal-title">添加知识</div>
    <div class="modal-field">
      <div class="modal-label">标题（选填）</div>
      <input type="text" id="add-title" placeholder="不填时会使用链接标题">
    </div>
    <div class="modal-field">
      <div class="modal-label">知识链接</div>
      <input type="url" id="add-url" placeholder="https://… 博客、GitHub 仓库、YouTube/B站 视频">
    </div>
    <div class="modal-field">
      <div class="modal-label">补充正文或笔记</div>
      <textarea id="add-content" placeholder="粘贴摘要、笔记或网页正文。链接和正文至少填写一项。"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('add-knowledge')">取消</button>
      <button class="btn-submit" onclick="submitAddKnowledge()">🤖 添加并让 AI 整理</button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────
const API = ''  // same origin
let token = localStorage.getItem('token') || ''
let orgs = []
let expandedOrgs = new Set()
let currentOrgId = null
let currentCatId = null
let currentOrgName = ''
let allItems = []
let pollTimer = null
let chatHistory = []

// ── Auth helpers ─────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers || {}) }
  })
  if (res.status === 401) { localStorage.removeItem('token'); location.reload(); return null }
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || res.status) }
  return res.status === 204 ? null : res.json()
}

// ── Boot ─────────────────────────────────────────────────────────────────
async function boot() {
  try {
    if (!token) {
      const d = await apiFetch('/api/auth/local/bootstrap', { method: 'POST' })
      if (!d) return
      token = d.access_token
      localStorage.setItem('token', token)
    }
    await loadOrgs()
  } catch(e) {
    console.error(e)
  }
}

async function loadOrgs() {
  orgs = await apiFetch('/api/organizations') || []
  renderVaultTree()
  // auto-select first org
  if (orgs.length > 0 && !currentOrgId) {
    await selectOrg(orgs[0].id, orgs[0].name)
  }
}

// ── Vault tree ───────────────────────────────────────────────────────────
async function renderVaultTree() {
  const tree = document.getElementById('vault-tree')
  tree.innerHTML = ''

  for (const org of orgs) {
    const wrap = document.createElement('div')
    wrap.className = 'vault-item'
    wrap.id = 'vault-' + org.id

    const isExpanded = expandedOrgs.has(org.id)
    const isActive = org.id === currentOrgId

    wrap.innerHTML = `
      <div class="vault-header${isActive ? ' active' : ''}" onclick="toggleVault(${org.id}, '${esc(org.name)}')">
        <span class="vault-chevron${isExpanded ? ' open' : ''}">▶</span>
        <span class="vault-icon">🗂</span>
        <span>${esc(org.name)}</span>
        <span class="vault-badge" id="badge-${org.id}">—</span>
      </div>
      <div class="cat-tree${isExpanded ? ' open' : ''}" id="cats-${org.id}">
        <div class="loader" style="padding:6px 28px;font-size:12px;color:var(--fg-3)">加载中…</div>
      </div>
    `
    tree.appendChild(wrap)

    if (isExpanded) {
      loadCatsForOrg(org.id)
    }
  }
}

async function toggleVault(orgId, name) {
  if (expandedOrgs.has(orgId)) {
    expandedOrgs.delete(orgId)
  } else {
    expandedOrgs.add(orgId)
    loadCatsForOrg(orgId)
  }
  await selectOrg(orgId, name)
  renderVaultTree()
}

async function selectOrg(orgId, name) {
  currentOrgId = orgId
  currentOrgName = name
  currentCatId = null
  expandedOrgs.add(orgId)
  updateBreadcrumb()
  await Promise.all([loadKnowledge(), loadCatsForOrg(orgId)])
  renderVaultTree()
}

async function loadCatsForOrg(orgId) {
  const [cats, config] = await Promise.all([
    apiFetch(`/api/organizations/${orgId}/categories`),
    apiFetch(`/api/organizations/${orgId}/classification`)
  ])
  renderCatTree(orgId, cats || [], config)
}

function renderCatTree(orgId, cats, config) {
  const container = document.getElementById('cats-' + orgId)
  if (!container) return

  container.innerHTML = ''

  // "全部" row
  const allRow = document.createElement('div')
  allRow.className = 'cat-all' + (orgId === currentOrgId && !currentCatId ? ' active' : '')
  allRow.textContent = '全部'
  allRow.onclick = () => selectCat(orgId, null, null)
  container.appendChild(allRow)

  const flat = flatCats(cats)
  for (const cat of cats) {
    appendCatRow(container, cat, 0, orgId)
  }

  // update badge
  const badge = document.getElementById('badge-' + orgId)
  if (badge) badge.textContent = flat.length > 0 ? flat.length + ' 类' : '无分类'

  // show no-template banner
  if (orgId === currentOrgId) {
    const banner = document.getElementById('no-template-banner')
    if (banner) {
      if (!config || !config.template_key) banner.classList.remove('hidden')
      else banner.classList.add('hidden')
    }
  }
}

function appendCatRow(container, cat, depth, orgId) {
  const row = document.createElement('div')
  row.className = 'cat-item' + (cat.id === currentCatId ? ' active' : '')
  row.style.paddingLeft = (28 + depth * 14) + 'px'
  row.innerHTML = `<span class="cat-icon">📁</span>${esc(cat.name)}<span class="cat-count" id="cc-${cat.id}"></span>`
  row.onclick = (e) => { e.stopPropagation(); selectCat(orgId, cat.id, cat.name) }
  container.appendChild(row)
  if (cat.children && cat.children.length > 0) {
    for (const child of cat.children) appendCatRow(container, child, depth + 1, orgId)
  }
}

function flatCats(cats) {
  return cats.flatMap(c => [c, ...flatCats(c.children || [])])
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

async function selectCat(orgId, catId, catName) {
  if (orgId !== currentOrgId) await selectOrg(orgId, orgs.find(o => o.id === orgId)?.name || '')
  currentCatId = catId
  currentOrgId = orgId
  updateBreadcrumb(catName)
  await loadKnowledge()
  renderVaultTree()
}

function updateBreadcrumb(catName) {
  const bc = document.getElementById('breadcrumb')
  if (!bc) return
  if (catName) {
    bc.innerHTML = `<span>${esc(currentOrgName)}</span><span class="breadcrumb-sep">/</span><span class="breadcrumb-current">${esc(catName)}</span>`
  } else {
    bc.innerHTML = `<span class="breadcrumb-current">${esc(currentOrgName)}</span>`
  }
}

// ── Knowledge ────────────────────────────────────────────────────────────
let searchQuery = ''

function handleSearch() {
  searchQuery = document.getElementById('search-input').value
  loadKnowledge()
}

async function loadKnowledge() {
  if (!currentOrgId) return
  let url = `/api/organizations/${currentOrgId}/knowledge`
  const params = new URLSearchParams()
  if (currentCatId) params.set('category_id', currentCatId)
  if (searchQuery) params.set('search', searchQuery)
  if ([...params].length) url += '?' + params

  allItems = await apiFetch(url) || []
  renderKnowledge()
  schedulePoll()
}

function renderKnowledge() {
  const list = document.getElementById('knowledge-list')
  const procCount = allItems.filter(i => i.status === 'processing').length

  // update processing banner
  const pb = document.getElementById('processing-banner')
  const pt = document.getElementById('processing-text')
  if (procCount > 0) {
    pb.classList.remove('hidden')
    pt.textContent = `AI 正在处理 ${procCount} 条知识，完成后自动刷新…`
  } else pb.classList.add('hidden')

  // tab badge
  const badge = document.getElementById('processing-badge')
  if (procCount > 0) { badge.removeAttribute('hidden'); badge.textContent = procCount }
  else badge.setAttribute('hidden', '')

  if (allItems.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">📭</div>
      <div class="empty-state-title">还没有知识</div>
      <div class="empty-state-sub">先添加一个链接或粘贴一段笔记，AI 会帮你整理分类。</div>
    </div>`
    return
  }

  list.innerHTML = allItems.map(item => renderCard(item)).join('')
}

function renderCard(item) {
  const icon = item.source_type === 'link' ? '🔗' : '📝'
  const statusTag = statusTagHtml(item.status)

  if (item.status === 'processing') {
    return `<div class="k-card processing">
      <div class="k-card-icon">${icon}</div>
      <div class="k-card-body">
        <div class="k-card-title">${esc(item.title)}</div>
        <div class="k-card-meta">${statusTag}</div>
        <div class="proc-steps">
          <span class="proc-step done"><span class="proc-dot"></span>已接收</span>
          <span class="proc-sep">→</span>
          <span class="proc-step active"><span class="proc-dot spinning"></span>${item.source_type==='link'?'抓取链接中':'读取内容'}</span>
          <span class="proc-sep">→</span>
          <span class="proc-step"><span class="proc-dot"></span>AI 分类</span>
        </div>
      </div>
    </div>`
  }

  const catTag = item.category_name ? `<span class="tag tag-blue">📁 ${esc(item.category_name)}</span>` : ''
  const tags = (item.tags || []).slice(0, 5).map(t => `<span class="k-tag">${esc(t)}</span>`).join('')
  const sourceLink = item.source_url ? `<a href="${esc(item.source_url)}" target="_blank" class="tag tag-gray">↗ 来源</a>` : ''
  const reason = item.ai_reason ? `<div style="font-size:12px;color:var(--fg-3);margin-top:6px">AI：${esc(item.ai_reason)}</div>` : ''

  return `<div class="k-card">
    <div class="k-card-icon">${icon}</div>
    <div class="k-card-body">
      <div class="k-card-title">${esc(item.title)}</div>
      <div class="k-card-meta">${statusTag}${catTag}${sourceLink}</div>
      ${item.summary ? `<div class="k-card-summary">${esc(item.summary)}</div>` : ''}
      ${tags ? `<div class="k-card-tags">${tags}</div>` : ''}
      ${reason}
    </div>
    <div class="k-card-actions">
      <button class="k-action-btn danger" onclick="deleteItem(${item.id})" title="移除">🗑</button>
    </div>
  </div>`
}

function statusTagHtml(status) {
  if (status === 'review') return '<span class="tag tag-gold">需要确认</span>'
  if (status === 'processing') return '<span class="tag tag-blue">整理中…</span>'
  if (status === 'error') return '<span class="tag tag-red">处理失败</span>'
  return '<span class="tag tag-green">✓ 已整理</span>'
}

async function deleteItem(id) {
  if (!confirm('确定移除这条知识？')) return
  await apiFetch(`/api/organizations/${currentOrgId}/knowledge/${id}`, { method: 'DELETE' })
  allItems = allItems.filter(i => i.id !== id)
  renderKnowledge()
}

async function handleReprocess() {
  if (!currentOrgId) return
  await apiFetch(`/api/organizations/${currentOrgId}/knowledge/reprocess`, { method: 'POST' })
  await loadKnowledge()
}

// ── Polling ───────────────────────────────────────────────────────────────
function schedulePoll() {
  clearTimeout(pollTimer)
  if (allItems.some(i => i.status === 'processing')) {
    pollTimer = setTimeout(() => loadKnowledge(), 3000)
  }
}

// ── Add knowledge modal ───────────────────────────────────────────────────
async function submitAddKnowledge() {
  const title = document.getElementById('add-title').value.trim()
  const url = document.getElementById('add-url').value.trim()
  const content = document.getElementById('add-content').value.trim()
  if (!url && !content) { alert('请填写知识链接或正文内容'); return }
  if (!currentOrgId) { alert('请先选择一个知识空间'); return }

  const body = {}
  if (title) body.title = title
  if (url) body.source_url = url
  if (content) body.content = content

  try {
    const item = await apiFetch(`/api/organizations/${currentOrgId}/knowledge`, { method: 'POST', body: JSON.stringify(body) })
    closeModal('add-knowledge')
    document.getElementById('add-title').value = ''
    document.getElementById('add-url').value = ''
    document.getElementById('add-content').value = ''
    allItems = [item, ...allItems]
    renderKnowledge()
    schedulePoll()
  } catch(e) {
    alert('添加失败：' + e.message)
  }
}

// ── Tab switch ────────────────────────────────────────────────────────────
function switchTab(tab) {
  const main = document.getElementById('main')
  const tk = document.getElementById('tab-knowledge')
  const tc = document.getElementById('tab-chat')
  if (tab === 'chat') {
    main.classList.add('chat-active')
    tc.classList.add('active'); tk.classList.remove('active')
    if (currentOrgId && chatHistory.length === 0) loadChatHistory()
  } else {
    main.classList.remove('chat-active')
    tk.classList.add('active'); tc.classList.remove('active')
  }
}

// ── Chat ─────────────────────────────────────────────────────────────────
async function loadChatHistory() {
  if (!currentOrgId) return
  const msgs = await apiFetch(`/api/organizations/${currentOrgId}/ai/history`) || []
  chatHistory = msgs
  renderChat()
}

function renderChat() {
  const box = document.getElementById('chat-messages')
  const empty = document.getElementById('chat-empty')
  if (chatHistory.length === 0) {
    empty.style.display = 'flex'
    // remove non-empty rows
    box.querySelectorAll('.chat-row').forEach(r => r.remove())
    return
  }
  empty.style.display = 'none'
  box.querySelectorAll('.chat-row').forEach(r => r.remove())
  for (const msg of chatHistory) {
    box.appendChild(makeChatRow(msg.role, msg.content))
  }
  box.scrollTop = box.scrollHeight
}

function makeChatRow(role, content) {
  const row = document.createElement('div')
  row.className = 'chat-row ' + role
  const avatarIcon = role === 'user' ? '我' : '🤖'
  row.innerHTML = `
    <div class="chat-avatar">${avatarIcon}</div>
    <div class="chat-bubble">${esc(content)}</div>
  `
  return row
}

async function sendChat() {
  const input = document.getElementById('chat-input')
  const text = input.value.trim()
  if (!text || !currentOrgId) return
  input.value = ''

  const empty = document.getElementById('chat-empty')
  empty.style.display = 'none'

  const box = document.getElementById('chat-messages')
  box.appendChild(makeChatRow('user', text))
  box.scrollTop = box.scrollHeight

  // thinking indicator
  const thinking = document.createElement('div')
  thinking.className = 'chat-row assistant'
  thinking.innerHTML = `<div class="chat-avatar">🤖</div><div class="chat-bubble" style="color:var(--fg-3)"><span class="spinner">⟳</span> 思考中…</div>`
  box.appendChild(thinking)
  box.scrollTop = box.scrollHeight

  try {
    const res = await apiFetch(`/api/organizations/${currentOrgId}/ai/chat`, { method: 'POST', body: JSON.stringify({ message: text }) })
    thinking.remove()
    if (res) {
      chatHistory.push({ role: 'user', content: text, id: Date.now(), created_at: '' })
      chatHistory.push(res.message)
      box.appendChild(makeChatRow('assistant', res.message.content))
      box.scrollTop = box.scrollHeight
      if (res.action === 'reprocess') await loadKnowledge()
    }
  } catch(e) {
    thinking.remove()
    box.appendChild(makeChatRow('assistant', '抱歉，AI 暂时无法响应：' + e.message))
    box.scrollTop = box.scrollHeight
  }
}

function fillChat(text) {
  document.getElementById('chat-input').value = text
  document.getElementById('chat-input').focus()
}

// ── Modal helpers ─────────────────────────────────────────────────────────
function openModal(name) {
  document.getElementById('modal-' + name).classList.add('open')
}
function closeModal(name) {
  document.getElementById('modal-' + name).classList.remove('open')
}
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open') })
})

// ── Init ──────────────────────────────────────────────────────────────────
boot()
</script>
