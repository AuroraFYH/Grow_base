services:
  db:
    image: pgvector/pgvector:pg16
    container_name: growbase_db
    environment:
      POSTGRES_USER: growbase
      POSTGRES_PASSWORD: growbase123
      POSTGRES_DB: growbase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growbase"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
